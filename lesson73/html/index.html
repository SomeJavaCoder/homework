<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <section class="container">
        <form class="form" action="">
            <fieldset class="first-group">
                <legend class="first-group-name">Ваши личные данные</legend>

                <label class="name-label" for="name">Ваше имя</label>
                <input class="name-input" name="name" id="name" type="text" placeholder="Имя" required>

                <label class="age-label" for="age">Ваш возраст</label>
                <input id="age" class="age-input" type="number" name="age" placeholder="Возраст" inputmode="numeric" required>

                <label class="tel-label" for="tel">Ваш номер телефона</label>
                <input id="tel" class="tel-input" name="tel" type="tel" placeholder="Номер телефона" inputmode="tel" required>

                <label class="email-label" for="email">Ваша почта</label>
                <input type="email" name="email" id="email" class="email-input" placeholder="Почта" required>
                
                <fieldset class="second-group">
                    <label class="message-label" for="message">Сообщение</label>
                    <textarea class="message-area" name="message-area" id="message"></textarea>
    
                    <label class="political-label" for="political">
                        <input class="political-checkbox" id="political" type="checkbox" name="political" value="agree" required>
                        <span class="political-checkbox-text">Я принимаю правила</span>
                    </label>
                </fieldset>
                <button class="button-send">Отправить</button>
            </fieldset>
        </form>
    </section>
</body>

</html>
